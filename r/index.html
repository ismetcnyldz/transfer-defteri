<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Transfer Booking</title>
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../places-data.js"></script>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface2:#eeebe3;--line:#d9d4c8;--fg:#1b1f2a;--muted:#4a4f5c;--accent:#9a7417;--accent-fg:#fff;--accent-soft:#f3e8c9;--ok:#1f7a4d;--ok-soft:#dcefe3;--bad:#b3261e;--r:14px;--shadow:0 6px 24px rgba(27,31,42,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--surface:#1b1e26;--surface2:#242832;--line:#333845;--fg:#eceef2;--muted:#c2c7d1;--accent:#e0b860;--accent-fg:#1b1500;--accent-soft:#3a3118;--ok:#5ccb8e;--ok-soft:#163427;--bad:#f28b82;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px;padding-top:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.co{display:flex;align-items:center;gap:10px;min-width:0}
.co .mark{width:40px;height:40px;border-radius:12px;background:#1b1f2a;display:grid;place-items:center;color:#e0b860;font-weight:800;font-size:20px;flex:none}
.co h1{font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.langs{display:flex;gap:4px;background:var(--surface2);border-radius:999px;padding:3px}
.langs button{width:38px;height:32px;border-radius:999px;font-size:18px;display:grid;place-items:center}
.langs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.intro{color:var(--muted);font-size:14px}
fieldset{border:0;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px 0}
.f{display:grid;gap:3px;padding:10px 14px;border-top:1px solid var(--line);min-width:0;position:relative}
.sec-t + .f, .sec-t + .row2 > .f{border-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr}
.row2 > .f + .f{border-left:1px solid var(--line)}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:0;background:none;padding:3px 0;width:100%;min-width:0;outline:none;font-size:16px}
.f textarea{resize:vertical;min-height:64px}
.f input::placeholder,.f textarea::placeholder{color:#8a8e98;opacity:1}
.f.req label::after{content:" *";color:var(--bad)}
.f.bad{background:#fff3f2}
@media (prefers-color-scheme:dark){.f.bad{background:#2a1a19}}
.phone{display:flex;gap:8px;align-items:center}
.phone select{width:auto;max-width:120px;color:var(--muted);font-size:15px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.step .l{display:grid}
.step .l b{font-weight:700}
.step .l small{color:var(--muted);font-size:12px}
.ctr{display:flex;align-items:center;gap:0;background:var(--surface2);border-radius:999px}
.ctr button{width:40px;height:36px;font-size:20px;font-weight:700;color:var(--accent)}
.ctr button:disabled{color:var(--line)}
.ctr output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.note-names{font-size:13px;color:var(--muted);padding:6px 14px 2px}
#paxNames .f:first-child{border-top:0}
.ages{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.ages label{display:grid;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.ages select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:15px}
.seg{display:flex;gap:6px;padding:10px 14px 14px}
.seg button{flex:1;padding:10px;border-radius:10px;background:var(--surface2);font-weight:700;color:var(--muted);border:1px solid transparent}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.tog span{font-weight:600}
.sw{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.ac{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;max-height:280px;overflow-y:auto}
.ac button{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.ac button:first-child{border-top:0}
.ac button:active{background:var(--surface2)}
.ac .tx{min-width:0;display:grid}
.ac .tx b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .tx small{color:var(--muted);font-size:12px}
.pbtn{background:var(--accent);color:var(--accent-fg);font-weight:800;padding:15px;border-radius:12px;font-size:16px;width:100%;box-shadow:var(--shadow)}
.pbtn:disabled{opacity:.6}
.err{font-size:14px;color:var(--bad);font-weight:600}
.fine{font-size:12px;color:var(--muted);text-align:center}
.done{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:12px;text-align:center;box-shadow:var(--shadow)}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto}
.done h2{font-size:20px;font-weight:800}
.done p{margin:0;color:var(--muted)}
.sum{text-align:left;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum span{color:var(--muted)}
.wa{display:inline-block;background:var(--ok);color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;text-decoration:none}
.gone{text-align:center;padding:48px 16px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="co"><div class="mark" id="coMark">T</div><div><h1 id="coName">…</h1><small data-t="subtitle"></small></div></div>
    <div class="langs" id="langs">
      <button data-l="en" aria-label="English">🇬🇧</button>
      <button data-l="de" aria-label="Deutsch">🇩🇪</button>
      <button data-l="ru" aria-label="Русский">🇷🇺</button>
      <button data-l="tr" aria-label="Türkçe">🇹🇷</button>
    </div>
  </div>

  <form id="form" novalidate>
    <div class="wrap" style="padding-top:0">
    <p class="intro" data-t="intro"></p>

    <fieldset>
      <div class="sec-t" data-t="sec_you"></div>
      <div class="row2">
        <div class="f req"><label for="first" data-t="first"></label><input id="first" autocomplete="given-name" spellcheck="false" autocapitalize="words"></div>
        <div class="f req"><label for="last" data-t="last"></label><input id="last" autocomplete="family-name" spellcheck="false" autocapitalize="words"></div>
      </div>
      <div class="f req"><label for="phone" data-t="phone"></label>
        <div class="phone"><select id="cc"></select><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="170 1234567"></div>
        <small style="color:var(--muted);font-size:12px" data-t="phone_hint"></small></div>
      <div class="f"><label for="email" data-t="email"></label><input id="email" type="email" inputmode="email" autocomplete="email"></div>
    </fieldset>

    <fieldset>
      <div class="sec-t" data-t="sec_arrival"></div>
      <div class="row2">
        <div class="f req"><label for="date" data-t="date"></label><input id="date" type="date"></div>
        <div class="f req"><label for="time" data-t="time"></label><input id="time" type="time"></div>
      </div>
      <div class="f req"><label for="flight" data-t="flight"></label><input id="flight" placeholder="TK 1234" autocapitalize="characters" autocomplete="off"></div>
      <div class="f req"><label for="hotel" data-t="hotel"></label><input id="hotel" autocomplete="off" autocapitalize="words" data-ph="hotel_ph"></div>
      <div class="tog"><span data-t="return_q"></span><button type="button" class="sw" id="retSw" role="switch" aria-checked="false"></button></div>
      <div id="retBox" hidden>
        <div class="row2">
          <div class="f"><label for="rdate" data-t="rdate"></label><input id="rdate" type="date"></div>
          <div class="f"><label for="rtime" data-t="rtime"></label><input id="rtime" type="time"></div>
        </div>
        <div class="f req"><label for="rflight" data-t="rflight"></label><input id="rflight" placeholder="TK 1235" autocapitalize="characters" autocomplete="off"></div>
      </div>
    </fieldset>

    <fieldset>
      <div class="sec-t" data-t="sec_pax"></div>
      <div class="step" style="border-top:0"><div class="l"><b data-t="adults"></b><small data-t="adults_h"></small></div><div class="ctr"><button type="button" data-d="adults" data-v="-1">−</button><output id="adults">2</output><button type="button" data-d="adults" data-v="1">+</button></div></div>
      <div class="step"><div class="l"><b data-t="children"></b><small data-t="children_h"></small></div><div class="ctr"><button type="button" data-d="children" data-v="-1">−</button><output id="children">0</output><button type="button" data-d="children" data-v="1">+</button></div></div>
      <div class="ages" id="ages" hidden></div>
      <div class="step"><div class="l"><b data-t="infants"></b><small data-t="infants_h"></small></div><div class="ctr"><button type="button" data-d="infants" data-v="-1">−</button><output id="infants">0</output><button type="button" data-d="infants" data-v="1">+</button></div></div>
      <div class="step"><div class="l"><b data-t="seat"></b><small data-t="seat_h"></small></div></div>
      <div class="seg" id="seatSeg"><button type="button" data-s="1" data-t="yes"></button><button type="button" data-s="0" data-t="no" aria-pressed="true"></button></div>
      <div class="step"><div class="l"><b data-t="booster"></b><small data-t="booster_h"></small></div></div>
      <div class="seg" id="boosterSeg"><button type="button" data-s="1" data-t="yes"></button><button type="button" data-s="0" data-t="no" aria-pressed="true"></button></div>
      <div class="step"><div class="l"><b data-t="luggage"></b><small data-t="luggage_h"></small></div><div class="ctr"><button type="button" data-d="luggage" data-v="-1">−</button><output id="luggage">2</output><button type="button" data-d="luggage" data-v="1">+</button></div></div>
    </fieldset>

    <fieldset>
      <div class="sec-t" data-t="sec_names"></div>
      <div class="note-names" data-t="names_h"></div>
      <div id="paxNames"></div>
    </fieldset>

    <fieldset>
      <div class="sec-t" data-t="sec_note"></div>
      <div class="f" style="border-top:0"><label for="note" data-t="note"></label><textarea id="note" data-ph="note_ph"></textarea></div>
    </fieldset>

    <div class="err" id="err" hidden></div>
    <button class="pbtn" id="send" type="submit" data-t="send"></button>
    <div class="fine" data-t="fine"></div>
    </div>
  </form>

  <div class="done" id="done" hidden>
    <div class="ok">✓</div>
    <h2 data-t="done_t"></h2>
    <p data-t="done_p"></p>
    <div class="sum" id="sum"></div>
    <div id="meetBox" hidden style="display:grid;gap:10px;text-align:left">
      <b id="meetT" style="font-size:16px"></b>
      <div id="meetText" style="white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:12px;font-size:15px"></div>
      <img id="meetPhoto" alt="" style="width:100%;border-radius:10px" hidden>
      <video id="meetVideo" controls playsinline preload="metadata" style="width:100%;border-radius:10px;background:#000" hidden></video>
      <a id="meetLink" target="_blank" rel="noopener" style="font-weight:700;color:var(--accent)"></a>
    </div>
    <a class="wa" id="waBtn" target="_blank" rel="noopener" hidden data-t="wa"></a>
    <button class="fine" id="again" style="text-decoration:underline" data-t="again"></button>
  </div>
</div>
<div class="gone" id="gone" hidden>This booking link is not valid.</div>

const CC=[["+49","🇩🇪"],["+7","🇷🇺"],["+44","🇬🇧"],["+90","🇹🇷"],["+380","🇺🇦"],["+48","🇵🇱"],["+31","🇳🇱"],["+32","🇧🇪"],["+33","🇫🇷"],["+41","🇨🇭"],["+43","🇦🇹"],["+45","🇩🇰"],["+46","🇸🇪"],["+47","🇳🇴"],["+358","🇫🇮"],["+420","🇨🇿"],["+421","🇸🇰"],["+36","🇭🇺"],["+40","🇷🇴"],["+375","🇧🇾"],["+7 ","🇰🇿"],["+972","🇮🇱"],["+1","🇺🇸"],["+39","🇮🇹"],["+34","🇪🇸"],["+351","🇵🇹"],["+353","🇮🇪"],["+370","🇱🇹"],["+371","🇱🇻"],["+372","🇪🇪"],["+359","🇧🇬"],["+30","🇬🇷"],["+966","🇸🇦"],["+971","🇦🇪"],["+965","🇰🇼"],["+974","🇶🇦"],["+98","🇮🇷"],["+964","🇮🇶"],["+994","🇦🇿"],["+995","🇬🇪"],["+374","🇦🇲"],["+998","🇺🇿"],["+996","🇰🇬"],["+86","🇨🇳"],["+81","🇯🇵"],["+82","🇰🇷"],["+91","🇮🇳"]];
$("cc").innerHTML=CC.map(([c,f])=>`<option value="${c.trim()}">${f} ${c.trim()}</option>`).join("");

let lang="en",company=null,extraPlaces=[];
const counts={adults:2,children:0,infants:0,luggage:2};
const MIN={adults:1,children:0,infants:0,luggage:0},MAX={adults:30,children:20,infants:10,luggage:40};
let seat=false,booster=false;

function setLang(l){
  lang=T[l]?l:"en";document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=T[lang][el.dataset.t];if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll("[data-ph]").forEach(el=>{el.placeholder=T[lang][el.dataset.ph]||"";});
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false"));
  document.title=(company?company.name+" · ":"")+T[lang].subtitle;
  renderAges();renderNames();
  const def={en:"+44",de:"+49",ru:"+7",tr:"+90"}[lang];if(!$("phone").value&&def)$("cc").value=def;
  try{localStorage.setItem("tb_lang",lang);}catch(e){}
}
document.querySelectorAll("#langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));

document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.d;counts[k]=Math.max(MIN[k],Math.min(MAX[k],counts[k]+ +b.dataset.v));$(k).textContent=counts[k];if(k==="children")renderAges();renderNames();}));
let paxNames={};
function renderNames(){
  const t=T[lang];const box=$("paxNames");
  // mevcut yazılanları koru
  box.querySelectorAll("input[data-k]").forEach(i=>{paxNames[i.dataset.k]=i.value;});
  const lead=(($("first").value||"")+" "+($("last").value||"")).trim();
  const rows=[];
  rows.push(`<div class="f"><label>1. ${esc(t.n_adult)} ${esc(t.n_you)}</label><input value="${esc(lead)}" disabled style="opacity:.8"></div>`);
  for(let i=2;i<=counts.adults;i++)rows.push(`<div class="f req"><label for="pn_a${i}">${i}. ${esc(t.n_adult)}</label><input id="pn_a${i}" data-k="a${i}" data-type="adult" autocapitalize="words" spellcheck="false" value="${esc(paxNames["a"+i]||"")}"></div>`);
  for(let i=1;i<=counts.children;i++)rows.push(`<div class="f req"><label for="pn_c${i}">${i}. ${esc(t.n_child)}${ages[i-1]!=null?" ("+ages[i-1]+")":""}</label><input id="pn_c${i}" data-k="c${i}" data-type="child" data-age="${ages[i-1]??""}" autocapitalize="words" spellcheck="false" value="${esc(paxNames["c"+i]||"")}"></div>`);
  for(let i=1;i<=counts.infants;i++)rows.push(`<div class="f req"><label for="pn_i${i}">${i}. ${esc(t.n_infant)}</label><input id="pn_i${i}" data-k="i${i}" data-type="infant" autocapitalize="words" spellcheck="false" value="${esc(paxNames["i"+i]||"")}"></div>`);
  box.innerHTML=rows.join("");
}
["first","last"].forEach(id=>$(id).addEventListener("input",()=>{const i=$("paxNames").querySelector("input[disabled]");if(i)i.value=(($("first").value||"")+" "+($("last").value||"")).trim();}));
let ages=[];
function renderAges(){
  const box=$("ages");ages=ages.slice(0,counts.children);while(ages.length<counts.children)ages.push(6);
  box.hidden=!counts.children;
  box.innerHTML=ages.map((a,i)=>`<label>${esc(T[lang].age)} ${i+1}<select data-i="${i}">${Array.from({length:10},(_,n)=>n+2).map(n=>`<option ${n===a?"selected":""}>${n}</option>`).join("")}</select></label>`).join("");
  box.querySelectorAll("select").forEach(s=>s.addEventListener("change",()=>{ages[+s.dataset.i]=+s.value;renderNames();}));
}
$("boosterSeg").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{booster=b.dataset.s==="1";$("boosterSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));}));
$("seatSeg").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{seat=b.dataset.s==="1";$("seatSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));}));
$("retSw").addEventListener("click",()=>{const on=$("retSw").getAttribute("aria-checked")!=="true";$("retSw").setAttribute("aria-checked",on?"true":"false");$("retBox").hidden=!on;});

/* otel önerileri kapalı: müşteri kendisi yazar */

/* submit */
const mark=(id,bad)=>$(id).closest(".f").classList.toggle("bad",bad);
$("form").addEventListener("submit",async e=>{
  e.preventDefault();const t=T[lang];const E=$("err");E.hidden=true;
  const first=$("first").value.trim(),last=$("last").value.trim(),phoneRaw=$("phone").value.replace(/[^\d]/g,""),date=$("date").value,time=$("time").value,hotel=$("hotel").value.trim();
  /* uçuş kodu: TK1234, TK 1234, EZY2145, U2 8123, PC-1234 … (2–3 karakter havayolu + rakam) */
  const flightOk=v=>{const c=String(v||"").toUpperCase().replace(/[\s\-\.]/g,"");return /^[A-Z0-9]{2,3}\d{1,5}[A-Z]?$/.test(c)&&/[A-Z]/.test(c)&&c.length<=9;};
  const retOn=$("retSw").getAttribute("aria-checked")==="true";
  const fBad=!flightOk($("flight").value),rfBad=retOn&&!flightOk($("rflight").value);
  let bad=false;[["first",!first],["last",!last],["phone",phoneRaw.length<6],["date",!date],["time",!time],["flight",fBad],["hotel",!hotel]].concat(retOn?[["rflight",rfBad]]:[]).forEach(([id,b])=>{mark(id,b);if(b)bad=true;});
  if(bad&&first&&last&&phoneRaw.length>=6&&date&&time&&hotel&&(fBad||rfBad)){E.textContent=t.err_flight;E.hidden=false;E.scrollIntoView({block:"center"});return;}
  if(bad){E.textContent=phoneRaw&&phoneRaw.length<6?t.err_phone:t.err_req;E.hidden=false;E.scrollIntoView({block:"center"});return;}
  if(date<new Date().toISOString().slice(0,10)){mark("date",true);E.textContent=t.err_date;E.hidden=false;return;}
  let namesBad=false;const others=[...$("paxNames").querySelectorAll("input[data-k]")];
  others.forEach(i=>{const b=i.value.trim().length<2;i.closest(".f").classList.toggle("bad",b);if(b)namesBad=true;});
  if(namesBad){E.textContent=t.err_names;E.hidden=false;(others.find(i=>i.value.trim().length<2)||E).scrollIntoView({block:"center"});return;}
  const passengers=[{type:"adult",name:(first+" "+last).trim()}].concat(others.map(i=>({type:i.dataset.type,name:i.value.trim().replace(/\s+/g," "),age:i.dataset.age||""})));
  const ret=$("retSw").getAttribute("aria-checked")==="true";
  const payload={first_name:first,last_name:last,phone:$("cc").value+" "+$("phone").value.trim(),email:$("email").value.trim(),language:lang,date,time,flight:$("flight").value.trim().toUpperCase(),
    return_date:ret?$("rdate").value:"",return_time:ret?$("rtime").value:"",return_flight:ret?$("rflight").value.trim().toUpperCase():"",
    adults:counts.adults,children:counts.children,child_ages:ages.slice(0,counts.children),infants:counts.infants,baby_seat:seat,booster:booster,luggage:counts.luggage,
    hotel,area:$("hotel").dataset.area||"",from_place:"Antalya Havalimanı (AYT) – Dış Hatlar T1",to_place:"Otel",customer_note:$("note").value.trim(),passengers};
  $("send").disabled=true;
  const {error}=await sb.rpc("submit_booking",{p_slug:slug,p:payload});
  $("send").disabled=false;
  if(error){E.textContent=t.err_net+" ("+error.message+")";E.hidden=false;return;}
  $("form").hidden=true;$("done").hidden=false;window.scrollTo(0,0);
  const M=company&&company.meeting;
  if(M&&((M.texts&&Object.keys(M.texts).length)||M.photo||M.video)){
    const mt=M.texts&&(M.texts[lang]||M.texts.en||Object.values(M.texts)[0]);
    $("meetT").textContent={tr:"📍 Havalimanında buluşma noktası",en:"📍 Airport meeting point",de:"📍 Treffpunkt am Flughafen",ru:"📍 Место встречи в аэропорту"}[lang];
    $("meetText").textContent=mt||"";$("meetText").hidden=!mt;
    if(M.photo){$("meetPhoto").src=M.photo;$("meetPhoto").hidden=false;}
    if(M.video){$("meetVideo").src=M.video;if(M.poster)$("meetVideo").poster=M.poster;$("meetVideo").hidden=false;}
    const ml=location.origin+location.pathname.replace(/r\/?[^/]*$/,"")+"k/?c="+encodeURIComponent(slug)+"&l="+lang;
    $("meetLink").href=ml;$("meetLink").textContent={tr:"Bu sayfayı açmak için dokunun (diğer diller)",en:"Open this page (other languages)",de:"Diese Seite öffnen (andere Sprachen)",ru:"Открыть страницу (другие языки)"}[lang];
    $("meetBox").hidden=false;
  }
  $("sum").innerHTML=`<div><span>${t.s_name}</span><b>${esc(first+" "+last)}</b></div><div><span>${t.s_arr}</span><b>${esc(date.split("-").reverse().join("."))} ${esc(time)}${payload.flight?" · "+esc(payload.flight):""}</b></div><div><span>${t.s_hotel}</span><b>${esc(hotel)}</b></div><div><span>${t.s_pax}</span><b>${esc(t.pax(counts.adults,counts.children,counts.infants))}${seat?" · "+t.seat:""}${booster?" · "+t.booster:""}</b></div>${ret&&payload.return_date?`<div><span>${t.s_ret}</span><b>${esc(payload.return_date.split("-").reverse().join("."))} ${esc(payload.return_time)}</b></div>`:""}`;
  if(company&&company.whatsapp){const d=company.whatsapp.replace(/[^\d]/g,"");$("waBtn").hidden=false;$("waBtn").href="https://wa.me/"+d+"?text="+encodeURIComponent((lang==="tr"?"Merhaba, transfer talebi gönderdim: ":lang==="de"?"Hallo, ich habe eine Transferanfrage gesendet: ":lang==="ru"?"Здравствуйте, я отправил(а) заявку на трансфер: ":"Hello, I sent a transfer request: ")+first+" "+last+", "+date+" "+time);}
});
$("again").addEventListener("click",()=>location.reload());

/* boot */
(async()=>{
  let saved=null;try{saved=localStorage.getItem("tb_lang");}catch(e){}
  const nav=(navigator.language||"en").slice(0,2).toLowerCase();
  setLang(saved||(T[nav]?nav:"en"));
  $("date").min=new Date().toISOString().slice(0,10);
  if(!slug){$("app").hidden=true;$("gone").hidden=false;return;}
  const [{data:co,error},{data:pl}]=await Promise.all([sb.rpc("public_company",{p_slug:slug}),sb.rpc("public_places",{p_slug:slug})]);
  const c=co&&co[0];
  if(error||!c){$("app").hidden=true;$("gone").hidden=false;return;}
  company=c;extraPlaces=pl||[];
  $("coName").textContent=c.name;$("coMark").textContent=(c.name||"T").trim()[0].toUpperCase();
  document.title=c.name+" · "+T[lang].subtitle;
})();
})();
</script>
