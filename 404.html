<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfer Defteri</title>
<script>
// Kısa müşteri linkleri: transferdefteri.net/vip  ->  /r/?c=vip
(function(){var p=location.pathname.replace(/^\/+|\/+$/g,"");if(p&&/^[a-z0-9-]{2,40}$/i.test(p)&&p!=="r"){location.replace("/r/?c="+encodeURIComponent(p.toLowerCase()));}else{document.addEventListener("DOMContentLoaded",function(){document.getElementById("m").hidden=false;});}})();
</script></head><body style="font-family:system-ui;background:#f6f4ef;color:#1b1f2a;display:grid;place-items:center;min-height:100vh;margin:0"><div id="m" hidden style="text-align:center"><h1 style="font-size:20px">Sayfa bulunamadı</h1><p><a href="/" style="color:#9a7417;font-weight:700">Ana sayfaya dön</a></p></div></body></html>
